name: Deploy BorderoX PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PWA files
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f manifest.webmanifest
          test -f sw.js
          test -f icon-192.svg
          test -f icon-512.svg
          test -f icon-512-maskable.svg
          python -m json.tool manifest.webmanifest >/dev/null
          grep -q '"name"' manifest.webmanifest
          grep -q '"short_name"' manifest.webmanifest
          grep -q '"start_url"' manifest.webmanifest
          grep -q '"display"' manifest.webmanifest
          grep -q 'serviceWorker.register' app.js
          grep -q "updateViaCache:'none'" app.js
          grep -q 'SENSITIVE_QUERY_RE' sw.js
          grep -q "request.headers.has('cookie')" sw.js
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
